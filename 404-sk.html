<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#06090f">
    <title>Stránka sa nenašla | WebBridge.AI</title>

    <!-- Served for any missing address, so every path starts at the site root. -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="preload" href="/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="hero not-found">
        <header class="site-header">
            <a href="/sk" class="logo"><span class="logo-web">Web</span>Bridge<span class="logo-highlight">.AI</span></a>
            <nav class="lang-switch" aria-label="Jazyk">
                <a href="/" hreflang="en" lang="en"><img src="/assets/flags/gb.svg" alt="English" width="28" height="21"></a>
                <a href="/sk" hreflang="sk" lang="sk" aria-current="true"><img src="/assets/flags/sk.svg" alt="Slovenčina" width="28" height="21"></a>
            </nav>
        </header>

        <div class="hero-content">
            <div class="not-found-code" aria-hidden="true">
                <svg class="not-found-threads" viewBox="0 0 200 100" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="threads-web" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0">
                            <stop offset="0" stop-color="currentColor" stop-opacity="0"></stop>
                            <stop offset="1" stop-color="currentColor"></stop>
                        </linearGradient>
                    </defs>
                    <g stroke="url(#threads-web)">
                        <path d="M0 6C110 6 90 50 200 50"></path>
                        <path d="M0 28C110 28 90 50 200 50"></path>
                        <path d="M0 50H200"></path>
                        <path d="M0 72C110 72 90 50 200 50"></path>
                        <path d="M0 94C110 94 90 50 200 50"></path>
                    </g>
                </svg>
                <span><span class="logo-web">4</span>0<span class="logo-highlight">4</span></span>
                <svg class="not-found-threads not-found-threads-ai" viewBox="0 0 200 100" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="threads-ai" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0">
                            <stop offset="0" stop-color="currentColor" stop-opacity="0"></stop>
                            <stop offset="1" stop-color="currentColor"></stop>
                        </linearGradient>
                    </defs>
                    <g stroke="url(#threads-ai)">
                        <path d="M0 6C110 6 90 50 200 50"></path>
                        <path d="M0 28C110 28 90 50 200 50"></path>
                        <path d="M0 50H200"></path>
                        <path d="M0 72C110 72 90 50 200 50"></path>
                        <path d="M0 94C110 94 90 50 200 50"></path>
                    </g>
                </svg>
            </div>
            <h1>Táto stránka neexistuje.</h1>
            <p>Odkaz môže byť nesprávny alebo sa stránka presunula.</p>
            <div class="hero-actions">
                <a href="/sk" class="btn">Späť na úvod</a>
                <a href="mailto:info@webbridge.ai" data-contact class="btn btn-ghost">Ozvite sa</a>
            </div>
        </div>
    </main>
    <script src="/js/contact.js"></script>
</body>
</html>
