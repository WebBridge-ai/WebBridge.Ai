<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Programujeme weby a aplikácie a zapájame do nich AI. Zadáte úlohu, dostanete riešenie.">
    <meta name="theme-color" content="#06090f">
    <title>WebBridge.AI – Web, ktorý pracuje za vás</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Decided before first paint, so the poster does not flash ahead of the intro video.
        const saveData = navigator.connection && navigator.connection.saveData;
        if (!saveData && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('motion');
        }
    </script>
</head>
<body>
    <div class="hero">
        <div class="hero-media" id="heroMedia"></div>

        <header class="site-header">
            <a href="./" class="logo">
                <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <rect x="2" y="9" width="13" height="14" rx="2.5" stroke="#ffb454" stroke-width="2.4"/>
                    <path d="M15 16h7" stroke="#f2efe6" stroke-width="2.4"/>
                    <circle cx="25.5" cy="16" r="4.5" fill="#7fd4ff"/>
                </svg>
                <span>WebBridge<span class="logo-highlight">.AI</span></span>
            </a>
        </header>

        <main class="hero-content">
            <h1>Web, ktorý pracuje za&nbsp;vás.</h1>
            <p>Programujeme weby a&nbsp;aplikácie a&nbsp;zapájame do&nbsp;nich AI. Zadáte úlohu, dostanete riešenie.</p>
            <a href="mailto:info@webbridge.ai" class="btn">Napíšte nám, čo riešite</a>
        </main>

        <footer class="site-footer">
            <span>&copy; 2026 WebBridge.AI s.r.o.</span>
            <a href="mailto:info@webbridge.ai">info@webbridge.ai</a>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
