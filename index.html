<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WebBridge.AI – softvér na mieru, weby, integrácie, AI aj prevádzka. Pomôžeme s každým IT riešením.">
    <meta name="theme-color" content="#06090f">
    <title>WebBridge.AI – Pomôžeme s každým IT riešením</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Decided before first paint, so the poster does not flash ahead of the intro video.
        const saveData = navigator.connection && navigator.connection.saveData;
        if (!saveData && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('motion');
        }
    </script>
</head>
<body>
    <div class="hero">
        <div class="hero-media" id="heroMedia"></div>

        <header class="site-header">
            <a href="./" class="logo">
                <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <path d="M21 3 16 28" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                    <path d="M20.5 6 4 23M19.8 10 9 22.4M19 14 14 21.8M21 7 28 23" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                    <path d="M1.5 25C11 20.5 21 20.5 30.5 25" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
                <span>WebBridge<span class="logo-highlight">.AI</span></span>
            </a>
        </header>

        <main class="hero-content">
            <h1>Pomôžeme s&nbsp;každým IT&nbsp;riešením.</h1>
            <p>Softvér na mieru, weby, integrácie, AI aj prevádzka. Povedzte nám, čo treba vyriešiť.</p>
            <a href="mailto:info@webbridge.ai" class="btn">Napíšte nám</a>
        </main>

        <footer class="site-footer">
            <span>&copy; 2026 WebBridge.AI s.r.o.</span>
            <a href="mailto:info@webbridge.ai">info@webbridge.ai</a>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
