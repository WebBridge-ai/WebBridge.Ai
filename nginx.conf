# Clean addresses (/sk serves sk.html) and the custom 404 page.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    # Relative Location headers, so redirects stay on https behind the Coolify proxy.
    absolute_redirect off;

    error_page 404 /404.html;

    # Old .html addresses move to the clean ones: /index.html -> /, /sk.html -> /sk.
    if ($request_uri ~ ^([^?]*/)index\.html(\?.*)?$) {
        return 301 $1$2;
    }
    if ($request_uri ~ ^([^?]+)\.html(\?.*)?$) {
        return 301 $1$2;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    # A typed trailing slash goes to the clean address: /sk/ -> /sk.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # The 404 page sits outside the site root, so it never answers with a 200.
    location = /404.html {
        root /usr/share/nginx/errors;
        internal;
    }
}
